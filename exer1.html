<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Reflexos</title>
    <link rel="stylesheet" href="exer1.css">
    
</head>
<body>
    <div class="jogo">
        <h1>Jogo de Reflexos</h1>
        <p>Clique no círculo o máximo de vezes que conseguir em 10 segundos!</p>

        <div class="indicadores">
            <span>Tempo: <strong id="tempo">10</strong>s</span>
            <span>Pontos: <strong id="pontos">0</strong></span>
        </div>

        <button id="iniciar">Iniciar jogo</button>

        <div id="areaJogo">
            <div id="alvo"></div>
        </div>
    </div>
    <script src="exer1.js"></script>
</body>
</html>
